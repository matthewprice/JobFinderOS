# Example simulation registry: real companies with public Greenhouse / Ashby / Lever
# boards. Copy to sim/registry.yaml (gitignored) and trim to 20 to 25 that resolve.
# `sim snapshot` reports any slug that returns 404 so you can fix or drop it.
#
# tier: "1" marks a priority company (hub-city-only postings still surface, flagged).
